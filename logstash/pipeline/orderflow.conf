# ============================================================
# Logstash Pipeline - OrderFlow logs
# ============================================================
# Input:  TCP port 5044, recibe JSON del order-processor
# Filter: parsea timestamp y clasifica eventos
# Output: Elasticsearch, indice orderflow-logs-YYYY.MM.dd
# ============================================================

input {
  tcp {
    port => 5044
    codec => json_lines
    tags => ["orderflow", "processor"]
  }
}

filter {
  # El processor envia timestamp ISO8601 en el campo "timestamp".
  # Lo usamos como @timestamp del evento.
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
    remove_field => ["timestamp"]
  }

  # Clasificacion rapida por severidad
  if [level] == "ERROR" {
    mutate { add_tag => ["error"] }
  } else if [level] == "WARNING" {
    mutate { add_tag => ["warning"] }
  }

  # Marcar eventos de negocio vs eventos operativos
  if [event] == "order_processed" or [event] == "order_failed" {
    mutate { add_field => { "event_category" => "business" } }
  } else {
    mutate { add_field => { "event_category" => "operational" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "orderflow-logs-%{+YYYY.MM.dd}"
    action => "create"
  }

  # Util para debugging - descomentar si necesitas ver que llega:
  # stdout { codec => rubydebug }
}
