# ============================================================
# Logstash Pipeline - OrderFlow logs
# ============================================================
# Input:  TCP 5044   -> order-processor, JSON estructurado
#         syslog 5000 -> order-generator, texto plano (Sesion 3)
# Filter: cada origen se procesa por separado, segun su tag
# Output: Elasticsearch, indice orderflow-logs-YYYY.MM.dd
#         Un unico indice compartido por ambos origenes: asi se
#         pueden correlacionar en Kibana con una sola consulta.
# ============================================================
# Ampliado en la Sesion 3. El bloque del processor es el original
# de la Sesion 1: no se modifico, solo se envolvio en un condicional
# para que no se aplique tambien a los eventos del generator.
# ============================================================

input {

  # --- Sesion 1: el processor envia JSON por TCP ---
  # json_lines espera un objeto JSON por linea, terminado en \n.
  # Es exactamente lo que emite LogstashTCPHandler en processor.py.
  tcp {
    port => 5044
    codec => json_lines
    tags => ["orderflow", "processor"]
  }

  # --- Sesion 3: el generator llega via driver syslog de Docker ---
  # Este input escucha en TCP y UDP a la vez. El driver de Docker
  # usa UDP, que es el puerto que publica docker-compose.yml.
  syslog {
    port => 5000
    tags => ["orderflow", "generator"]
  }
}

filter {

  # ============================================================
  # ORIGEN 1: order-processor (JSON ya estructurado)
  # ============================================================
  if "processor" in [tags] {

    # El processor emite el campo "timestamp" con el formato por
    # defecto de python-json-logger, que NO es ISO8601 estricto:
    #
    #   2026-08-12 03:12:15,842
    #    ^^^^^^^^^^ separador espacio, no "T"
    #                       ^ coma decimal, no punto
    #
    # Por eso se declara el patron explicito ANTES de ISO8601. Si se
    # deja solo ISO8601, el parseo falla en silencio: el evento entra
    # igual en Elasticsearch pero con @timestamp = hora de ingesta y
    # una etiqueta _dateparsefailure. Los logs aparecen desplazados
    # unos segundos y nadie entiende por que.
    date {
      match => [ "timestamp", "yyyy-MM-dd HH:mm:ss,SSS", "ISO8601" ]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }

    # Clasificacion rapida por severidad
    if [level] == "ERROR" {
      mutate { add_tag => ["error"] }
    } else if [level] == "WARNING" {
      mutate { add_tag => ["warning"] }
    }

    # Separar eventos de negocio de eventos operativos.
    # Permite en Kibana filtrar "solo lo que le importa al negocio"
    # sin conocer los nombres de los eventos.
    if [event] == "order_processed" or [event] == "order_failed" {
      mutate { add_field => { "event_category" => "business" } }
    } else {
      mutate { add_field => { "event_category" => "operational" } }
    }
  }

  # ============================================================
  # ORIGEN 2: order-generator (texto plano, hay que estructurarlo)
  # ============================================================
  if "generator" in [tags] {

    # El generator loguea texto plano a proposito, para que se vea la
    # diferencia. Formato real:
    #   "%(asctime)s %(levelname)s - %(message)s"
    # Ejemplo:
    #   2026-08-12 14:32:07,481 INFO - Order generated: id=a1b2c3d4,
    #   region=lima, items=3, total=S/145.90
    #
    # grok convierte esa cadena en campos consultables. Solo se aplica
    # a las lineas que son de orden: el generator tambien emite logs de
    # arranque y de reconexion que no siguen este formato, y si se les
    # aplicara el patron cada uno anadiria un _grokparsefailure inutil.
    if [message] =~ /Order generated:/ {
      grok {
        match => {
          "message" => "Order generated: id=%{DATA:order_id_short}, region=%{WORD:region}, items=%{NUMBER:items_count:int}, total=S/%{NUMBER:total_amount:float}"
        }
      }

      mutate {
        add_field => { "event" => "order_generated" }
        add_field => { "event_category" => "business" }
      }
    } else {
      mutate {
        add_field => { "event" => "generator_operational" }
        add_field => { "event_category" => "operational" }
      }
    }

    # El input syslog deja el nivel dentro del texto. Se extrae para
    # que "level" signifique lo mismo venga del origen que venga.
    if [message] =~ /\sERROR\s/ {
      mutate { add_field => { "level" => "ERROR" } add_tag => ["error"] }
    } else if [message] =~ /\sWARNING\s/ {
      mutate { add_field => { "level" => "WARNING" } add_tag => ["warning"] }
    } else {
      mutate { add_field => { "level" => "INFO" } }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "orderflow-logs-%{+YYYY.MM.dd}"
    action => "create"
  }

  # Util para depurar: descomentar para ver por consola exactamente
  # que esta entrando, con todos sus campos y etiquetas.
  #   docker compose logs -f logstash
  # stdout { codec => rubydebug }
}
